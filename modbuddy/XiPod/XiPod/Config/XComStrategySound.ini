[MusicModdingSystem.MMS_XComStrategySoundManager]
; Anarchy Radio FM ships this section EMPTY on purpose.
;
; The desktop app writes the real entries into the game's user config
; directory, where it can account for which states are toggled on and which
; folders actually have music in them. Shipping a second copy here meant both
; files appended their own +MusicDefs, so MMS ended up holding two defs per
; group and picking between them at random. That is why the game's own music
; sometimes played anyway (Def_AAFlawless winning over XiPod_Silence_AAFlawless
; mid-session) and why the Geoscape toggle did nothing — this file silenced
; Geoscape regardless of what the app had been told.
;
; With nothing here, an install that has never run the app just gets MMS's own
; music, which is the correct fallback.
