[AnarchyRadioFM.X2DownloadableContentInfo_AnarchyRadioFM]
DLCIdentifier="AnarchyRadioFM"

[AnarchyRadioFM.XiPod_CinematicWatcher]
; Logs every candidate cinematic predicate to Launch.log as "XIPOD: CINE_DBG"
; whenever one of them changes. Used to work out which signal fires before a
; Kismet-driven cinematic, since those never reach the narrative queue that
; catches the story ones. Set to false once detection is settled.
bVerbose=true

; Treat "the game is in cinematic mode" as a cinematic. OFF because that flag
; is set for plenty of things that are not films, and a false positive mutes
; the music mid-mission. Turn on only if a CINE_DBG capture shows cinemode
; going true just before Movie Started and staying false otherwise.
bUseCinematicMode=false
